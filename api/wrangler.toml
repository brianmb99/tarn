name = "tarn-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — Wrangler creates DNS record on first deploy
routes = [
  { pattern = "api.getbookish.app", custom_domain = true },
  { pattern = "api.tarn.dev", custom_domain = true }
]

[observability]
enabled = true

# Cron Trigger — CORE observability sweep (api/src/observability/scheduled.js).
# Hourly: readiness + D1<->Arweave drift + Turbo balance/runway + aux-table
# cleanup. Writes a report to the health_reports table and POSTs ALERT_WEBHOOK_URL
# when unhealthy.
[triggers]
crons = ["0 * * * *"]

# D1 Database (entries cache)
[[d1_databases]]
binding = "DB"
database_name = "tarn-api"
database_id = "c09eeae0-04e4-444a-88e5-bf8f7ce91dbd"

# KV Namespace (IP rate limiting + write rate limiting)
[[kv_namespaces]]
binding = "RATE_KV"
id = "3e2a7f0cba82490eb3053f1d5b7af5a8"

# KV Namespace (auth nonces — 5 min TTL, single-use)
[[kv_namespaces]]
binding = "AUTH_KV"
id = "f93f7550a0ed496eb2e4fd1c2e9bc75d"

# Secrets (set via wrangler secret put <NAME> --name tarn-api):
#   JWT_SECRET                - Base64-encoded 256-bit HMAC key for JWT signing
#   APP_SIGNING_KEY           - Hex-encoded Ethereum-compatible private key for signing Arweave DataItems
#                                This wallet must have Turbo balance for uploads > 100KB.
#                                Generate: openssl rand -hex 32
#   TARN_APP_KEY_BOOKISH      - Hex-encoded ECDSA P-256 private key for the bookish app role.
#
# Observability subsystem. Three of these are REQUIRED for unattended
# operation (tarn#68) — while any is unset, the hourly report carries an
# ALERTING_UNCONFIGURED / HEARTBEAT_UNCONFIGURED / FUNDING_FLOOR_UNSET flag
# and reports unhealthy. Setup walkthrough: docs/OPERATIONS.md.
#   ALERT_WEBHOOK_URL         - REQUIRED for unattended ops. The hourly cron
#                                POSTs the report JSON here when a check fails
#                                (Slack-style {text, report}). Unset →
#                                console.warn only — alerts go nowhere.
#                                Verify after setting: see docs/OPERATIONS.md.
#   HEARTBEAT_URL             - REQUIRED for unattended ops. Dead-man's switch:
#                                the cron GETs this on EVERY tick (healthy or
#                                not) — point it at a healthchecks.io/UptimeRobot
#                                heartbeat that alerts on SILENCE, so a dead
#                                worker or stopped cron pages even though it
#                                can't report itself.
#   TURBO_MIN_BALANCE_WINC    - REQUIRED for unattended ops. Absolute balance
#                                floor in winc (default 0 = off). With near-zero
#                                paid burn the runway estimate is Infinity, so
#                                without a floor LOW_FUNDING can never fire
#                                before the first large failure. Sizing guide
#                                in docs/OPERATIONS.md.
#   ADMIN_APP_ID              - If set, only this app_id may read
#                                GET /api/v1/admin/health-report. Unset → any
#                                app-role JWT may read it.
#   DRIFT_LAG_WINDOW_MS       - Drift lag tolerance (default 1800000 = 30 min;
#                                arweave.net L1 indexing lags ~15-25 min).
#   TURBO_RUNWAY_FLOOR_DAYS   - Alert LOW_FUNDING under this runway (default 14).
#   AUDIT_RETENTION_DAYS      - account_key_fetch_log retention (default 90).
#
# Local-dev only (set in api/.dev.vars, never as a remote secret):
#   TARN_SKIP_TURBO=true      - Short-circuit Turbo uploads to a no-op success
#                                response so integration tests work when the
#                                local dev wallet has no Turbo balance. D1
#                                write-through still runs; only the Arweave
#                                bundling network call is skipped. NEVER set
#                                this in production — writes would never reach
#                                Arweave.
