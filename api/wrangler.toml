name = "tarn-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — Wrangler creates DNS record on first deploy
routes = [
  { pattern = "api.getbookish.app", custom_domain = true },
  { pattern = "api.tarn.dev", custom_domain = true }
]

[observability]
enabled = true

# D1 Database (entries cache)
[[d1_databases]]
binding = "DB"
database_name = "tarn-api"
database_id = "c09eeae0-04e4-444a-88e5-bf8f7ce91dbd"

# KV Namespace (IP rate limiting + write rate limiting)
[[kv_namespaces]]
binding = "RATE_KV"
id = "3e2a7f0cba82490eb3053f1d5b7af5a8"

# KV Namespace (auth nonces — 5 min TTL, single-use)
[[kv_namespaces]]
binding = "AUTH_KV"
id = "f93f7550a0ed496eb2e4fd1c2e9bc75d"

# Secrets (set via wrangler secret put <NAME> --name tarn-api):
#   JWT_SECRET                - Base64-encoded 256-bit HMAC key for JWT signing
#   APP_SIGNING_KEY           - Hex-encoded Ethereum-compatible private key for signing Arweave DataItems
#                                This wallet must have Turbo balance for uploads > 100KB.
#                                Generate: openssl rand -hex 32
#   TARN_APP_KEY_BOOKISH      - Hex-encoded ECDSA P-256 private key for the bookish app role.
#   EMAIL_FORWARDER_API_KEY   - Resend API key (re_...) for the recovery PDF email
#                                forwarder (issue #12). If unset, /api/v1/recovery/email
#                                returns 503; apps can still let users download the PDF
#                                client-side (emailRecoveryKit: false on register).
#   EMAIL_FORWARDER_FROM      - Verified sender address for the relay,
#                                e.g. "Tarn <recovery@tarn.dev>".
